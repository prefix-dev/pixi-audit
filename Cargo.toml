[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["pixi contributors <hi@prefix.dev>"]
edition = "2024"
homepage = "https://github.com/prefix-dev/pixi_audit"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/prefix-dev/pixi_audit"
rust-version = "1.95"

[workspace.dependencies]
axum = "0.8"
clap = "4.6"
console = "0.16"
cvss = "2.0"
dirs = "6.0.0"
futures = "0.3.31"
# Same crate pixi uses for HTTP caching. Its middleware is written against
# crates.io's `reqwest-middleware`, which `[patch.crates-io]` below redirects
# to the astral fork so the two share one `Middleware` trait.
http-cache-reqwest = { version = "1.0.0-alpha.8", default-features = false, features = [
  "manager-cacache",
  "reqwest-middleware",
  "url-standard",
] }
iocraft = "0.8.5"
jiff = { version = "0.2", default-features = false, features = ["std"] }
miette = "7.6.0"
osv_protocol = { path = "crates/osv_protocol", version = "0.1.0" }
pixi_audit = { path = "crates/pixi_audit", version = "0.1.0" }
# Same version pixi pins, so the `LockFile` type identity unifies when pixi
# consumes these crates. `rattler_conda_types` must be the version
# `rattler_lock` depends on, so the `PackageName` inside a lock file is the
# same type `pixi_audit` exposes.
rattler_lock = { version = "0.31", default-features = false }
rattler_conda_types = "0.48"
# Same middleware crate pixi uses (its workspace renames `astral-reqwest-middleware`
# to `reqwest-middleware`), so the `ClientWithMiddleware` type identity unifies
# when pixi consumes these crates.
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = { package = "astral-reqwest-middleware", version = "0.5" }
serde = "1.0.218"
serde_json = "1.0.139"
supports-hyperlinks = "3.2"
tempfile = "3"
thiserror = "2.0.12"
tokio = "1.43.0"
toml = "1.0"
toml_edit = "0.25"
url = "2.5"
uv-normalize = "0.0.67"
uv-pep440 = "0.0.67"

[patch.crates-io]
# Redirect crates.io's `reqwest-middleware` to a shim that re-exports
# `astral-reqwest-middleware`, so `http-cache-reqwest`'s middleware plugs
# into the same `ClientWithMiddleware` the rest of the workspace uses.
reqwest-middleware = { path = "patches/reqwest_middleware_shim" }
