[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["pixi contributors <hi@prefix.dev>"]
edition = "2024"
homepage = "https://github.com/prefix-dev/pixi-audit"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/prefix-dev/pixi-audit"
rust-version = "1.90"

[workspace.dependencies]
axum = "0.8"
clap = "4.6"
console = "0.16"
cvss = "2.0"
futures = "0.3.31"
miette = "7.6.0"
osv_protocol = { path = "crates/osv_protocol", version = "0.1.0" }
pixi_audit = { path = "crates/pixi_audit", version = "0.1.0" }
# Same version pixi pins, so the `LockFile` type identity unifies when pixi
# consumes these crates.
rattler_lock = { version = "0.31", default-features = false }
# Same middleware crate pixi uses (its workspace renames `astral-reqwest-middleware`
# to `reqwest-middleware`), so the `ClientWithMiddleware` type identity unifies
# when pixi consumes these crates.
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = { package = "astral-reqwest-middleware", version = "0.5" }
serde = "1.0.218"
serde_json = "1.0.139"
tempfile = "3"
thiserror = "2.0.12"
tokio = "1.43.0"
toml = "0.8"
url = "2.5"
