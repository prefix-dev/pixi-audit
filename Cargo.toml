[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["pixi contributors <hi@prefix.dev>"]
edition = "2024"
homepage = "https://github.com/prefix-dev/pixi_audit"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/prefix-dev/pixi_audit"
rust-version = "1.98"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
clap = "4.6"
console = "0.16"
cvss = "2.0"
dirs = "6.0.0"
futures = "0.3.31"
http = "1"
http-cache-reqwest = { version = "1.0.0-alpha.8", default-features = false, features = [
  "manager-cacache",
  "reqwest-middleware",
  "url-standard",
] }
iocraft = "0.8.5"
jiff = { version = "0.2", default-features = false, features = ["std"] }
miette = "7.6.0"
osv_protocol = { path = "crates/osv_protocol", version = "0.2.2" }
osv_client = { path = "crates/osv_client", version = "0.2.2" }
pixi_audit_test_support = { path = "crates/pixi_audit_test_support" }
pixi_audit = { path = "crates/pixi_audit", version = "0.2.2" }
# Public package types must match Pixi and rattler_lock.
rattler_lock = { version = "0.34.15", default-features = false }
rattler_conda_types = "0.58"
rattler_networking = "0.34"
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = { package = "astral-reqwest-middleware", version = "0.5" }
serde = "1.0.218"
serde_json = "1.0.139"
supports-hyperlinks = "3.2"
tempfile = "3"
thiserror = "2.0.12"
threat_feeds = { path = "crates/threat_feeds", version = "0.2.2" }
tokio = "1.43.0"
toml = "1.0"
toml_edit = "0.25"
url = "2.5"
uv-normalize = "0.0.99"
uv-pep440 = "0.0.99"

[patch.crates-io]
# Unify http-cache-reqwest's middleware trait with Astral's fork.
reqwest-middleware = { path = "patches/reqwest_middleware_shim" }
