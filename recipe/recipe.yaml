# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  name: pixi-audit
  version: "${{ env.get('PIXI_AUDIT_VERSION', default='0.1.0dev') }}"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ..

build:
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - cargo install --locked --no-track --root ${{ PREFIX }} --path crates/pixi_audit_cli
  files:
    - bin/pixi-audit
    - bin/pixi-audit.exe

requirements:
  build:
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}

tests:
  - script: pixi-audit --help
  - package_contents:
      bin:
        - pixi-audit

about:
  homepage: https://github.com/prefix-dev/pixi_audit
  repository: https://github.com/prefix-dev/pixi_audit
  summary: Audit pixi lock files for known vulnerabilities
  description: |
    pixi-audit is a pixi extension that audits packages in a pixi.lock file
    against prefix.dev's OSV-compatible vulnerability database.
  license: BSD-3-Clause
  license_file: LICENSE
