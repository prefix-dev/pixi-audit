[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64", "win-arm64"]
preview = ["pixi-build"]

[tasks]
build = "cargo build --workspace"
fmt = "cargo fmt --all --check"
install = "cargo install --path crates/pixi_audit_cli --locked"
lint = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
test = "cargo test --workspace"
test-minimal = "cargo check --workspace --no-default-features --all-targets && cargo test -p pixi_audit --no-default-features"
check = { depends-on = ["fmt", "lint", "test", "test-minimal"] }

[package]
name = "pixi-audit"
description = "Audit pixi lock files for known vulnerabilities"
homepage = "https://github.com/prefix-dev/pixi_audit"
license = "BSD-3-Clause"
publish = true
repository = "https://github.com/prefix-dev/pixi_audit"

[package.build]
source = { path = "crates/pixi_audit_cli" }

[package.build.backend]
name = "pixi-build-rust"

[package.build.config]
binaries = ["pixi-audit"]
# aws-lc-sys needs clang-cl for aarch64-pc-windows-msvc. Its per-target CC takes
# precedence over the `CC=cl.exe` set by the conda MSVC activation.
env = { CARGO_PROFILE_RELEASE_LTO = "thin", CARGO_PROFILE_RELEASE_STRIP = "symbols", AWS_LC_SYS_CC_aarch64_pc_windows_msvc = "clang-cl" }

[package.build-dependencies]
rust = "1.95.*"

[package.build-dependencies."if(host_platform == 'win-arm64')"]
clang = "*"

[dev]
pixi-audit = { path = "." }

# Checks a package built with `pixi publish`. Kept out of the default
# environment so it doesn't build pixi-audit from source first.
[feature.verify.dependencies]
python = ">=3.12"

[feature.verify.tasks.verify-package]
cmd = "python scripts/verify_package.py '{{ dist }}' --package-version '{{ package_version }}' --cli-version '{{ cli_version }}'"
args = ["dist", { arg = "package_version", default = "" }, { arg = "cli_version", default = "" }]
description = "Check the version and binary of the package built into `dist`"

[environments]
verify = { features = ["verify"], no-default-feature = true }
