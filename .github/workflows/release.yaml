name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: prefix.dev channel (defaults to the PREFIX_CHANNEL repository variable)
        required: false
        type: string

permissions:
  contents: read

jobs:
  metadata:
    name: Release metadata
    if: github.repository == 'prefix-dev/pixi_audit' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      build-number: ${{ steps.release.outputs.build-number }}
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine release metadata
        id: release
        shell: bash
        env:
          DEFAULT_CHANNEL: ${{ vars.PREFIX_CHANNEL }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          CHANNEL="${REQUESTED_CHANNEL:-$DEFAULT_CHANNEL}"
          if [[ ! "$CHANNEL" =~ ^([A-Za-z0-9][A-Za-z0-9._-]*/)?[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Set PREFIX_CHANNEL to a valid prefix.dev channel path or provide one when dispatching." >&2
            exit 1
          fi

          BUILD_NUMBER=$(git rev-list --first-parent --count HEAD)
          VERSION=$(cargo metadata --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "pixi_audit_cli") | .version')
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Could not determine the pixi_audit_cli version." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match pixi_audit_cli version $VERSION." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main." >&2
            exit 1
          fi

          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing pixi-audit $VERSION build $BUILD_NUMBER to $CHANNEL"

  build:
    name: Build ${{ matrix.target }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-64
          - runner: macos-15-intel
            target: osx-64
          - runner: macos-15
            target: osx-arm64
          - runner: windows-latest
            target: win-64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.78.0
          run-install: false

      - name: Build package
        shell: bash
        run: >-
          pixi publish
          --path pixi.toml
          --target-platform ${{ matrix.target }}
          --build-number ${{ needs.metadata.outputs.build-number }}
          --build-dir "$RUNNER_TEMP/pixi-build"
          --target-dir dist
          --clean

      - name: Verify package
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          shopt -s nullglob
          packages=(dist/*.conda)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one package, found ${#packages[@]}." >&2
            exit 1
          fi
          if [[ $(basename "${packages[0]}") != "pixi-audit-${EXPECTED_VERSION}-"*.conda ]]; then
            echo "Package version does not match pixi_audit_cli $EXPECTED_VERSION." >&2
            exit 1
          fi
          ACTUAL_VERSION=$(pixi exec --spec "${packages[0]}" pixi-audit --version)
          if [[ "$ACTUAL_VERSION" != "pixi-audit $EXPECTED_VERSION" ]]; then
            echo "Binary version $ACTUAL_VERSION does not match package version $EXPECTED_VERSION." >&2
            exit 1
          fi
          echo "Built and tested ${packages[0]}"

      - name: Save package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*.conda
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to ${{ needs.metadata.outputs.channel }}
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.78.0
          run-install: false

      - name: Publish packages with attestations
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREFIX_CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/package-*/*.conda)
          if (( ${#packages[@]} != 4 )); then
            echo "Expected four packages, found ${#packages[@]}." >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            pixi upload prefix \
              --channel "$PREFIX_CHANNEL" \
              --generate-attestation \
              --skip-existing \
              "$package"
          done
