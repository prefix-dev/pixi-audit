name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Skip dev builds for merges that change nothing in the package.
    # GitHub does not apply path filters to tag pushes.
    paths-ignore:
      - "**.md"
      - LICENSE
      - release-plz.toml
      - .github/chainguard/**
      - .github/workflows/ci.yml
      - .github/workflows/release-plz.yaml
  workflow_dispatch:
    inputs:
      channel:
        description: prefix.dev channel (defaults to the PREFIX_CHANNEL repository variable)
        required: false
        type: string

permissions:
  contents: read

jobs:
  metadata:
    name: Release metadata
    if: >-
      github.repository == 'prefix-dev/pixi_audit' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      build-number: ${{ steps.release.outputs.build-number }}
      channel: ${{ steps.release.outputs.channel }}
      cli-version: ${{ steps.release.outputs.cli-version }}
      kind: ${{ steps.release.outputs.kind }}
      package-version: ${{ steps.release.outputs.package-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine release metadata
        id: release
        shell: bash
        env:
          DEFAULT_CHANNEL: ${{ vars.PREFIX_CHANNEL }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          CHANNEL="${REQUESTED_CHANNEL:-$DEFAULT_CHANNEL}"
          if [[ ! "$CHANNEL" =~ ^([A-Za-z0-9][A-Za-z0-9._-]*/)?[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Set PREFIX_CHANNEL to a valid prefix.dev channel path or provide one when dispatching." >&2
            exit 1
          fi

          BUILD_NUMBER=$(git rev-list --first-parent --count HEAD)
          VERSION=$(cargo metadata --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "pixi_audit_cli") | .version')
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Could not determine the pixi_audit_cli version." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
              echo "Release tag $RELEASE_TAG does not match pixi_audit_cli version $VERSION." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tag must point to a commit on main." >&2
              exit 1
            fi
            KIND=release
            CLI_VERSION="$VERSION"
            PACKAGE_VERSION="$VERSION"
          else
            # A merged release PR changes the version. Its v<version> tag
            # publishes the release, so skip the dev build of that commit.
            PREVIOUS_VERSION=$(git show HEAD^1:crates/pixi_audit_cli/Cargo.toml | \
              sed -n 's/^version = "\([^"]*\)"$/\1/p')
            if [[ -z "$PREVIOUS_VERSION" ]]; then
              echo "Could not read the pixi_audit_cli version of the previous commit." >&2
              exit 1
            fi
            if [[ "$VERSION" != "$PREVIOUS_VERSION" ]]; then
              echo "This commit changes the version from $PREVIOUS_VERSION to $VERSION; the v$VERSION tag publishes it."
              echo "kind=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Cannot derive a dev version from pixi_audit_cli version $VERSION." >&2
              exit 1
            fi
            # Dev builds sort after the current release and before the next one:
            # 0.1.2 < 0.1.3.dev52 < 0.1.3, and also < 0.2.0.
            NEXT="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            KIND=dev
            CLI_VERSION="$NEXT-dev.$BUILD_NUMBER"
            PACKAGE_VERSION="$NEXT.dev$BUILD_NUMBER"
          fi

          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "cli-version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "package-version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing pixi-audit $PACKAGE_VERSION build $BUILD_NUMBER to $CHANNEL"

      # Cargo needs a semver pre-release (0.1.3-dev.52) while Conda versions
      # cannot contain a dash, so pixi.toml sets the package version (0.1.3.dev52).
      - name: Set dev version
        if: steps.release.outputs.kind == 'dev'
        shell: bash
        env:
          CLI_VERSION: ${{ steps.release.outputs.cli-version }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package-version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"$/s//version = \"$CLI_VERSION\"/" crates/pixi_audit_cli/Cargo.toml
          cargo update --workspace
          sed -i "/^\[package\]$/a version = \"$PACKAGE_VERSION\"" pixi.toml
          git diff

      - name: Save dev sources
        if: steps.release.outputs.kind == 'dev'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-sources
          path: |
            Cargo.lock
            pixi.toml
            crates/pixi_audit_cli/Cargo.toml
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: metadata
    if: needs.metadata.outputs.kind != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-64
          - runner: macos-15-intel
            target: osx-64
          - runner: macos-15
            target: osx-arm64
          - runner: windows-latest
            target: win-64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore dev sources
        if: needs.metadata.outputs.kind == 'dev'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dev-sources
          path: .
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Build package
        shell: bash
        run: >-
          pixi publish
          --path pixi.toml
          --target-platform ${{ matrix.target }}
          --build-number ${{ needs.metadata.outputs.build-number }}
          --build-dir "$RUNNER_TEMP/pixi-build"
          --target-dir dist
          --clean

      - name: Verify package
        shell: bash
        env:
          EXPECTED_CLI_VERSION: ${{ needs.metadata.outputs.cli-version }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.package-version }}
        run: |
          shopt -s nullglob
          packages=(dist/*.conda)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one package, found ${#packages[@]}." >&2
            exit 1
          fi
          if [[ $(basename "${packages[0]}") != "pixi-audit-${EXPECTED_VERSION}-"*.conda ]]; then
            echo "Package version does not match $EXPECTED_VERSION." >&2
            exit 1
          fi
          ACTUAL_VERSION=$(pixi exec --spec "${packages[0]}" pixi-audit --version)
          if [[ "$ACTUAL_VERSION" != "pixi-audit $EXPECTED_CLI_VERSION" ]]; then
            echo "Binary version $ACTUAL_VERSION does not match $EXPECTED_CLI_VERSION." >&2
            exit 1
          fi
          echo "Built and tested ${packages[0]}"

      - name: Save package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*.conda
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to ${{ needs.metadata.outputs.channel }}
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Publish packages with attestations
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREFIX_CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/package-*/*.conda)
          if (( ${#packages[@]} != 4 )); then
            echo "Expected four packages, found ${#packages[@]}." >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            pixi upload prefix \
              --channel "$PREFIX_CHANNEL" \
              --generate-attestation \
              --store-github-attestation \
              --skip-existing \
              "$package"
          done
